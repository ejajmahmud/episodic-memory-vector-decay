[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "episodic-memory-vector-decay"
version = "0.1.0"
description = "Temporal power-law decay and relevance consolidation engine for agent episodic memory stores"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
episodic-memory-vector-decay = "episodic_memory_vector_decay.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["episodic_memory_vector_decay*"]
